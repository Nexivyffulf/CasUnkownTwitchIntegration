<!DOCTYPE html>
<html>
<head>
<title>Authenticated!</title>
<script>
    let x = new XMLHttpRequest();
    x.open("POST", location.origin + "/code");
	x.onreadystatechange = (event) => {
		if(x.readyState = XMLHttpRequest.DONE)
		{
			document.getElementById("token-status").innerText = x.responseText;
		}
	};
    x.send(location.hash.substr(1));
</script>
</head>
<body>
	<div style="position:absolute;top:50%;left:50%;text-align:center;transform:translate(-50%,-50%);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;padding: 50px;">
		<p><strong>Logged in!</strong><br/>You can close this now.</p>
		<p id="token-status">
			Checking token...
		</p>
	</div>
</body>
</html>
